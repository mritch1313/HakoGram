name: Build HakoGram

on:
  push:
    branches: [ master, arena/* ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install NDK and SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          export SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          echo "SDK_ROOT=$SDK_ROOT"
          ls $SDK_ROOT/cmdline-tools/ || true
          SDKMANAGER=$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find $SDK_ROOT -name sdkmanager | head -1)
          fi
          echo "Using $SDKMANAGER"
          yes | $SDKMANAGER --install "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" --sdk_root=$SDK_ROOT || yes | sdkmanager --install "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" --sdk_root=$SDK_ROOT
          $SDKMANAGER --list --sdk_root=$SDK_ROOT | head -50 || sdkmanager --list --sdk_root=$SDK_ROOT | head -50
          echo "NDK installed"
          ls $SDK_ROOT/ndk/ || ls $ANDROID_HOME/ndk/ || true
          ls $SDK_ROOT/cmake/ || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build HakoGram (universal afatRelease)
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace 2>&1 | tee gradle.log
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          retention-days: 14

      - name: Publish log excerpt to summary
        if: failure()
        run: |
          echo "## Build failure excerpt" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 500 gradle.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "See uploaded gradle.log artifact for full details" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with excerpt
        if: failure()
        run: |
          echo "Build failed, tail of gradle.log:" > /tmp/comment.txt
          echo '```' >> /tmp/comment.txt
          tail -n 300 gradle.log >> /tmp/comment.txt || echo "no log" >> /tmp/comment.txt
          echo '```' >> /tmp/comment.txt
          gh pr comment 1 --repo ${{ github.repository }} --body-file /tmp/comment.txt || echo "comment failed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HakoGram-apk
          path: |
            TMessagesProj_App/build/outputs/apk/afat/release/*.apk
            TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Build summary
        run: |
          ls -lh TMessagesProj_App/build/outputs/apk/ || true
          find TMessagesProj_App/build/outputs -name "*.apk" -type f | xargs ls -lh || true
